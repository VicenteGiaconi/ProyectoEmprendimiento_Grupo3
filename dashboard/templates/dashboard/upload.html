{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Subir Audio</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" id="upload-button" class="btn btn-primary">Subir</button>
        <div id="loading-message" style="display:none;" aria-live="polite">
            Procesando audio, por favor espere...
        </div>
    </form>

    <script>
        document.getElementById('upload-button').addEventListener('click', function() {
            this.disabled = true;
            document.getElementById('loading-message').style.display = 'block';
        });
    </script>
</div>
{% endblock %}
