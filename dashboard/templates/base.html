<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Atención al Cliente · Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .sidebar {
            height: calc(100vh - 56px);
            position: fixed;
            top: 56px;
            left: 0;
            width: 250px;
            background-color: #ffffff;
            border-right: 1px solid #dee2e6;
            padding-top: 1rem;
            z-index: 100;
        }
        .main-content {
            margin-left: 250px;
            margin-top: 56px;
            padding: 2rem;
        }
        /* Ajuste para accesibilidad al usar teclado */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #000;
            color: white;
            padding: 8px;
            z-index: 1000;
        }
        .skip-link:focus {
            top: 0;
        }
    </style>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
</head>
<body>

<a class="skip-link" href="#main-content">Saltar al contenido principal</a>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top" aria-label="Navegación principal">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'dashboard' %}">📞 Análisis de Calidad</a>
    </div>
</nav>

<nav class="sidebar" aria-label="Navegación lateral">
    <ul class="nav flex-column">
        <li class="nav-item">
            <a class="nav-link text-dark" href="{% url 'dashboard' %}">📊 Dashboard & Protocolos</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-dark" href="{% url 'upload_audio' %}">⬆️ Subir Audio</a>
        </li>
    </ul>
</nav>

<main id="main-content" class="main-content">
    {% block content %}
    {% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
