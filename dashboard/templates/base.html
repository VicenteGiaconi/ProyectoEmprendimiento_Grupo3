<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ClAudIA · Dashboard{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-3.5.0.min.js"></script>

    <style>
    /* ── Palette (base: #10b981 emerald) ─────────────────────── */
    :root {
        --em-50:  #ecfdf5;
        --em-100: #d1fae5;
        --em-200: #a7f3d0;
        --em-300: #6ee7b7;
        --em-400: #34d399;
        --em-500: #10b981;   /* ← primary brand */
        --em-600: #059669;
        --em-700: #047857;
        --em-800: #065f46;
        --em-900: #064e3b;
        --em-950: #022c22;
    }

    /* ── Reset & base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #f0f2f5;
        color: #1a1d23;
        font-size: 14px;
        line-height: 1.5;
    }

    /* ── Layout ────────────────────────────────────────────────── */
    .app-shell {
        display: flex;
        min-height: 100vh;
    }

    /* ── Sidebar ───────────────────────────────────────────────── */
    .sidebar {
        width: 220px;
        min-height: 100vh;
        background: var(--em-950);
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0; left: 0; bottom: 0;
        z-index: 200;
        flex-shrink: 0;
    }
    .sidebar-brand {
        padding: 20px 18px 16px;
        border-bottom: 1px solid rgba(255,255,255,.07);
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
    }
    .sidebar-brand-icon {
        width: 32px; height: 32px;
        background: linear-gradient(135deg, var(--em-500), var(--em-700));
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 16px; flex-shrink: 0;
    }
    .sidebar-brand-text {
        color: #fff;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: -.2px;
    }
    .sidebar-section {
        padding: 16px 10px 4px;
    }
    .sidebar-section-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: rgba(255,255,255,.3);
        padding: 0 8px;
        margin-bottom: 4px;
    }
    .sidebar-nav { padding: 0; margin: 0; list-style: none; }
    .sidebar-nav .nav-link {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 7px;
        color: rgba(255,255,255,.55);
        font-size: 13.5px;
        font-weight: 500;
        text-decoration: none;
        transition: background .12s, color .12s;
    }
    .sidebar-nav .nav-link:hover {
        background: rgba(255,255,255,.07);
        color: rgba(255,255,255,.9);
    }
    .sidebar-nav .nav-link.active {
        background: rgba(16,185,129,.2);
        color: var(--em-300);
    }
    .sidebar-nav .nav-link i { font-size: 15px; width: 18px; text-align: center; }
    .sidebar-footer {
        margin-top: auto;
        padding: 14px 10px;
        border-top: 1px solid rgba(255,255,255,.07);
    }
    .sidebar-footer .nav-link {
        display: flex; align-items: center; gap: 10px;
        padding: 7px 10px; border-radius: 7px;
        color: rgba(255,255,255,.35); font-size: 13px;
        text-decoration: none; transition: color .12s;
    }
    .sidebar-footer .nav-link:hover { color: rgba(255,255,255,.7); }

    /* ── Main area ──────────────────────────────────────────────── */
    .main-wrap {
        margin-left: 220px;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        flex: 1;
    }
    .topbar {
        height: 52px;
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        padding: 0 24px;
        position: sticky;
        top: 0;
        z-index: 100;
        gap: 12px;
    }
    .topbar-title {
        font-weight: 600;
        font-size: 14px;
        color: #374151;
        flex: 1;
    }
    .main-content {
        padding: 24px;
        flex: 1;
    }

    /* ── Cards ──────────────────────────────────────────────────── */
    .card {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .card-header-bar {
        padding: 14px 18px 0;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 2px;
    }
    .card-header-bar .card-title {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: #6b7280;
        margin: 0;
    }

    /* ── KPI cards ──────────────────────────────────────────────── */
    .kpi {
        padding: 18px 20px;
        border-radius: 10px;
        background: #fff;
        border: 1px solid #e5e7eb;
        transition: box-shadow .15s;
    }
    .kpi:hover { box-shadow: 0 4px 12px rgba(0,0,0,.07); }
    .kpi-icon {
        width: 36px; height: 36px; border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        font-size: 17px; margin-bottom: 14px;
    }
    .kpi-value {
        font-size: 26px; font-weight: 700;
        line-height: 1; color: #111827; margin-bottom: 4px;
    }
    .kpi-value sup { font-size: 14px; font-weight: 600; vertical-align: super; }
    .kpi-label { font-size: 12px; color: #6b7280; font-weight: 500; }
    .kpi-blue   .kpi-icon { background: #eff6ff; color: #3b82f6; }
    .kpi-green  .kpi-icon { background: #f0fdf4; color: #16a34a; }
    .kpi-amber  .kpi-icon { background: #fffbeb; color: #d97706; }
    .kpi-violet .kpi-icon { background: var(--em-50); color: var(--em-600); }

    /* ── Tabs (page-level) ──────────────────────────────────────── */
    .page-tabs {
        display: flex;
        gap: 2px;
        border-bottom: 2px solid #e5e7eb;
        margin-bottom: 20px;
        background: transparent;
    }
    .page-tabs .tab-btn {
        background: none; border: none; outline: none;
        padding: 9px 16px;
        font-size: 13.5px; font-weight: 500;
        color: #6b7280; cursor: pointer;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
        border-radius: 6px 6px 0 0;
        display: flex; align-items: center; gap: 7px;
        transition: color .12s, background .12s;
    }
    .page-tabs .tab-btn:hover { color: #374151; background: #f9fafb; }
    .page-tabs .tab-btn.active {
        color: var(--em-500); border-bottom-color: var(--em-500);
        font-weight: 600; background: none;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Table ──────────────────────────────────────────────────── */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table thead th {
        font-size: 11px; font-weight: 700;
        text-transform: uppercase; letter-spacing: .06em;
        color: #9ca3af; padding: 10px 14px;
        border-bottom: 1px solid #e5e7eb;
        background: #f9fafb; white-space: nowrap;
    }
    .data-table tbody td {
        padding: 11px 14px;
        border-bottom: 1px solid #f3f4f6;
        font-size: 13px; color: #374151;
        vertical-align: middle;
    }
    .data-table tbody tr:hover td { background: #fafafa; }
    .data-table tbody tr:last-child td { border-bottom: none; }

    /* ── Badges ─────────────────────────────────────────────────── */
    .badge {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 3px 9px; border-radius: 999px;
        font-size: 11.5px; font-weight: 600; line-height: 1.4;
    }
    .badge-blue    { background: #eff6ff; color: #1d4ed8; }
    .badge-green   { background: #f0fdf4; color: #15803d; }
    .badge-red     { background: #fef2f2; color: #b91c1c; }
    .badge-yellow  { background: #fefce8; color: #854d0e; }
    .badge-purple  { background: var(--em-50); color: var(--em-700); }
    .badge-gray    { background: #f3f4f6; color: #6b7280; }
    .badge-teal    { background: #f0fdfa; color: #0f766e; }
    .badge-orange  { background: #fff7ed; color: #c2410c; }

    /* ── Progress bar ───────────────────────────────────────────── */
    .prog-wrap { display: flex; align-items: center; gap: 8px; }
    .prog-bar-outer {
        flex: 1; height: 5px;
        background: #e5e7eb; border-radius: 999px; overflow: hidden;
        min-width: 60px;
    }
    .prog-bar-inner { height: 100%; border-radius: 999px; }
    .prog-hi  { background: var(--em-500); }
    .prog-mid { background: #d97706; }
    .prog-lo  { background: #dc2626; }
    .prog-pct { font-size: 12px; color: #6b7280; white-space: nowrap; }

    /* ── Protocol checklist ─────────────────────────────────────── */
    .checklist-item {
        display: flex; align-items: center; justify-content: space-between;
        padding: 9px 0;
        border-bottom: 1px solid #f3f4f6;
        font-size: 13px;
    }
    .checklist-item:last-child { border-bottom: none; }

    /* ── Chart empty state ──────────────────────────────────────── */
    .chart-empty {
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        height: 200px;
        color: #d1d5db; gap: 8px;
    }
    .chart-empty i { font-size: 32px; }
    .chart-empty span { font-size: 13px; }

    /* ── Upload dropzone ────────────────────────────────────────── */
    .dropzone {
        border: 2px dashed #d1d5db;
        border-radius: 10px; padding: 40px 20px;
        text-align: center; cursor: pointer;
        transition: all .15s;
    }
    .dropzone:hover, .dropzone.drag-over {
        border-color: var(--em-500); background: var(--em-50);
    }
    .dropzone i { font-size: 40px; color: var(--em-300); }

    /* ── Stat chip (detail page) ────────────────────────────────── */
    .stat-chip {
        background: #f9fafb; border: 1px solid #e5e7eb;
        border-radius: 8px; padding: 14px 16px;
    }
    .stat-chip .stat-label { font-size: 11px; color: #9ca3af; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
    .stat-chip .stat-value { font-size: 22px; font-weight: 700; color: #111827; line-height: 1.2; }
    .stat-chip .stat-unit  { font-size: 13px; color: #6b7280; }

    /* ── Scrollbar ──────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

    /* ── Accessibility ──────────────────────────────────────────── */
    .skip-link {
        position: absolute; top: -50px; left: 0;
        background: var(--em-500); color: #fff; padding: 8px 16px;
        border-radius: 0 0 6px 0; z-index: 9999;
        text-decoration: none; font-size: 13px;
        transition: top .15s;
    }
    .skip-link:focus { top: 0; }
    </style>
</head>
<body>
<a class="skip-link" href="#main-content">Saltar al contenido</a>

<div class="app-shell">

    <!-- ─── Sidebar ─────────────────────────────────────────── -->
    <aside class="sidebar" aria-label="Navegación principal">
        <a class="sidebar-brand" href="{% url 'dashboard' %}">
            <div class="sidebar-brand-icon"><i class="bi bi-headset"></i></div>
            <span class="sidebar-brand-text">ClAudIA</span>
        </a>

        <div class="sidebar-section">
            <p class="sidebar-section-label">Aplicación</p>
            <ul class="sidebar-nav">
                <li>
                    <a class="nav-link {% block nav_dashboard %}{% endblock %}"
                       href="{% url 'dashboard' %}">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
                <li>
                    <a class="nav-link {% block nav_upload %}{% endblock %}"
                       href="{% url 'upload_audio' %}">
                        <i class="bi bi-cloud-arrow-up"></i> Subir audio
                    </a>
                </li>
            </ul>
        </div>

        <div class="sidebar-footer">
            <a class="nav-link" href="{% url 'upload_audio' %}">
                <i class="bi bi-plus-circle"></i> Nueva atención
            </a>
            <form method="post" action="{% url 'logout' %}" style="margin:0;">
                {% csrf_token %}
                <button type="submit" class="nav-link"
                        style="width:100%;background:none;border:none;cursor:pointer;text-align:left;">
                    <i class="bi bi-box-arrow-left"></i>
                    <span>{{ request.user.username }}</span>
                    <span style="margin-left:auto;font-size:11px;opacity:.5;">Salir</span>
                </button>
            </form>
        </div>
    </aside>

    <!-- ─── Main wrap ────────────────────────────────────────── -->
    <div class="main-wrap">

        <!-- Topbar -->
        <header class="topbar">
            <span class="topbar-title">{% block topbar_title %}Dashboard{% endblock %}</span>
            {% block topbar_actions %}{% endblock %}
        </header>

        <!-- Content -->
        <main id="main-content" class="main-content">
            {% block content %}{% endblock %}
        </main>

    </div><!-- /main-wrap -->
</div><!-- /app-shell -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Lightweight tab engine (no Bootstrap dependency)
document.querySelectorAll('[data-tabs]').forEach(function(container) {
    var buttons = container.querySelectorAll('.tab-btn');
    var panels  = container.querySelectorAll('.tab-panel');
    buttons.forEach(function(btn) {
        btn.addEventListener('click', function() {
            var target = btn.getAttribute('data-target');
            buttons.forEach(function(b) { b.classList.remove('active'); });
            panels.forEach(function(p)  { p.classList.remove('active'); });
            btn.classList.add('active');
            var panel = container.querySelector('#' + target);
            if (panel) panel.classList.add('active');
        });
    });
    // Activate first tab by default
    if (buttons.length) buttons[0].click();
});
</script>
</body>
</html>
